<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Untuk Kamu ❤️</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(to right, #ff758c, #ff7eb3);
  color: white;
  text-align: center;
  overflow: hidden;
}

.container {
  position: relative;
  top: 50%;
  transform: translateY(-50%);
}

h1 { font-size: 3em; }

p {
  width: 80%;
  margin: auto;
  font-size: 1.2em;
  line-height: 1.6;
}

button {
  margin-top: 20px;
  padding: 12px 25px;
  border: none;
  border-radius: 20px;
  background: white;
  color: #ff4d6d;
  font-weight: bold;
  cursor: pointer;
}

/* FOTO */
img {
  width: 220px;
  margin-top: 20px;
  border-radius: 20px;
  display: none;
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

/* LOVE */
.heart {
  position: absolute;
  color: rgba(255,255,255,0.7);
  animation: fall 5s linear infinite;
}

@keyframes fall {
  0% { transform: translateY(-10%); }
  100% { transform: translateY(110vh); }
}
</style>
</head>

<body>

<div class="container">
  <h1>Selamat Ulang Tahun 🎉</h1>

  <p>
  Selamat ulang tahun ya sayangku, cintaku, masa depanku ❤️ <br><br>
  Makasih yaa sudah sabar… terutama sabar nunggu aku nikahin kamu. <br><br>
  Semoga semua yang kita rencanakan pelan-pelan jadi nyata. <br><br>
  Aku, Abdurrahman Halim, sayang banget sama kamu, Aisyah Aulia Dewi. Selamanya ❤️
  </p>

  <button onclick="showAll()">Klik Aku 💌</button>

  <br>
  <img id="foto" src="foto.jpg">
</div>

<!-- MUSIK -->
<audio id="music" loop>
  <source src="lagu.mp3" type="audio/mpeg">
</audio>

<script>
// 🎵 PLAY MUSIK + FOTO
function showAll() {
  document.getElementById("foto").style.display = "block";
  document.getElementById("music").play();
  alert("Aku serius… kamu masa depanku ❤️");
}

// 💖 LOVE JATUH
setInterval(() => {
  let heart = document.createElement("div");
  heart.innerHTML = "❤️";
  heart.className = "heart";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 20 + 10) + "px";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 5000);
}, 300);
</script>

</body>
</html>
